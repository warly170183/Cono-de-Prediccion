name: Generar .exe

# Cada vez que se actualiza main se compila el ejecutable de Windows.
# Descárgalo en: Releases → "Última versión (.exe)"  (o en Actions → la ejecución → Artifacts).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Pruebas
        run: npm test

      - name: Compilar TradingPredictor.exe
        run: npm run build:exe

      - name: Prueba de arranque del .exe
        shell: pwsh
        run: |
          $env:NO_OPEN = '1'
          $env:PORT = '3333'
          $env:DATA_DIR = "$env:RUNNER_TEMP\datos-prueba"
          $p = Start-Process -FilePath ".\release\TradingPredictor.exe" -PassThru -WindowStyle Hidden
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 2
            try {
              $h = Invoke-RestMethod -Uri "http://127.0.0.1:3333/api/health" -TimeoutSec 3
              $idx = Invoke-WebRequest -Uri "http://127.0.0.1:3333/" -UseBasicParsing -TimeoutSec 3
              if ($h.ok -and $idx.Content -match "<div id=.root.") { $ok = $true; break }
            } catch { }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "El .exe no arrancó o no sirve la interfaz" }
          Write-Host "El .exe arranca y sirve la interfaz correctamente"

      - uses: actions/upload-artifact@v4
        with:
          name: TradingPredictor-windows
          path: release/TradingPredictor.exe

      - name: Publicar en la release "latest"
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest release/TradingPredictor.exe \
            --title "Última versión (.exe)" \
            --notes "Generado automáticamente desde main (${{ github.sha }})." \
            --prerelease
